<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="https://cultofthepartyparrot.com/parrots/hd/slowparrot.gif" as="image" type="image/gif">
    <link rel="preload" href="https://cultofthepartyparrot.com/parrots/hd/partyparrot.gif" as="image" type="image/gif">
    <link rel="preload" href="https://cultofthepartyparrot.com/parrots/hd/parrotnotfound.gif" as="image" type="image/gif">
    <style>
        #slow,
        #party,
        #done {
            position: absolute;
            max-height: 100%;
            max-width: 100%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
        }
        #slow.active,
        #party.active,
        #done.active {
            opacity: 1;
        }
        #start {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 10px;
            font-size: 32px;
            line-height: 1em;
            display: block;
        }
    </style>
</head>
<body>
    <img id="slow" src="https://cultofthepartyparrot.com/parrots/hd/slowparrot.gif">
    <img id="party" src="https://cultofthepartyparrot.com/parrots/hd/partyparrot.gif">
    <img id="done" src="https://cultofthepartyparrot.com/parrots/hd/parrotnotfound.gif">
    <audio id="a1" src="./Bee in her Tub (Slow).ogg" preload></audio>
    <audio id="a2" src="./Plazma.ogg" preload></audio>
    <p id="trackname"></p>
    <button id="start">⏭</button>
    <script>
        var slow = document.getElementById("slow");
        var party = document.getElementById("party");
        var done = document.getElementById("done");
        var a1 = document.getElementById("a1");
        var a2 = document.getElementById("a2");
        var trackname = document.getElementById("trackname");
        var start = document.getElementById("start");
        function init(e) {
            if (a1.paused) {
                a1.play();
                a2.pause();
                trackname.innerHTML = decodeURI(a1.src.split(/[/.]/g).slice(-2)[0]);
            }
            else {
                a1.pause();
                a2.play();
                trackname.innerHTML = decodeURI(a2.src.split(/[/.]/g).slice(-2)[0]);
            }
        }
        function parrot() {
            if (!a1.paused && !slow.classList.contains("active")) {
                slow.classList.add("active");
                party.classList.remove("active");
                done.classList.remove("active");
            }
            else if (!a2.paused && !party.classList.contains("active")) {
                slow.classList.remove("active");
                party.classList.add("active");
                done.classList.remove("active");
            }
            else if (a1.paused && a2.paused) {
                slow.classList.remove("active");
                party.classList.remove("active");
                done.classList.add("active");
            }
            requestAnimationFrame(parrot);
        }
        parrot();
        start.addEventListener("click", init);
    </script>
</body>
</html>
